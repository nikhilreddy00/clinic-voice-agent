[project]
name = "clinic-session-router"
version = "0.1.0"
description = "Phase 11 control plane: assigns LiveKit room-per-call sessions to agent workers."
requires-python = ">=3.11"

# Intentionally tiny. The router holds no audio, no model, and no call state — it decides which
# worker takes a room and notices when a worker dies. Everything that would justify a heavier
# dependency set belongs in the worker.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # fastapi TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
