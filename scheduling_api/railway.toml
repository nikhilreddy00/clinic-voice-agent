# Railway deploy config — scheduling API (FastAPI + Postgres).
#
# Public HTTP service: the agent reaches it over its public Railway URL (set as the agent's
# SCHEDULING_API_BASE_URL). Railway routes public traffic to the port from the Dockerfile's
# EXPOSE 8000; if a deploy can't detect it, set the service's target port to 8000 in the
# Railway dashboard (no Dockerfile change needed).
#
# Phase 9 replaced SQLite with Postgres. Provision a Railway Postgres plugin and set
# CLINIC_DATABASE_URL to its connection string; the schema is applied and seeded on boot
# (db.init_db, idempotent), and a background sweeper rolls the seeded window forward so an
# always-on server never runs out of upcoming slots.
#
# Also set CLINIC_API_TOKEN and give the agent the same value: these endpoints mutate
# appointment state, and without the token they are open to anyone who finds the URL.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
