[project]
name = "scheduling-api"
version = "0.1.0"
description = "Clinic scheduling API (FastAPI + Postgres) with synthetic data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Phase 9: Postgres replaces SQLite. psycopg3 for async + a real connection pool;
    # [binary] avoids needing libpq headers locally.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # required by fastapi.testclient
    "pytest-asyncio>=0.24",  # concurrency/race tests need a real event loop
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
