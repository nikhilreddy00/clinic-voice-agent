# One-command local start for the whole stack: `docker compose up --build`.
#
#   scheduling_api  — FastAPI backend + /metrics + /dashboard, published on :8000
#   agent           — Pipecat voice agent in MODE=telephony (inbound LiveKit SIP calls)
#
# The agent reaches the API by its compose service name (scheduling_api), never localhost.
# Secrets live only in the git-ignored agent/.env (loaded via env_file) — none are baked into
# an image.
#
# Phase 16: the API no longer mounts logs/. It used to, because the dashboard read the agent's
# calls.jsonl off a shared bind mount — which worked here and nowhere else, since on Railway the
# two services are separate containers with no shared volume. Call metrics now travel over HTTP
# (POST /call-metrics) like everything else between these two services. The agent still writes
# logs/ for its own traces and debug log; nothing else reads it.

# DATABASE: Supabase by default. Set CLINIC_DATABASE_URL in your shell or a root .env to the
# project's SESSION POOLER string (port 5432 on aws-<region>.pooler.supabase.com) — the direct
# host is IPv6-only without the paid add-on and will hang on an IPv4 network.
#
# The local `postgres` service below is an OPT-IN fallback for offline work, not the default:
#     docker compose --profile local-db up
#     CLINIC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/clinic
# Without that profile it never starts, and scheduling_api talks to Supabase.

services:
  postgres:
    profiles: ["local-db"]           # opt-in only; Supabase is the default backend
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres    # local compose only — never a deployed credential
      POSTGRES_DB: clinic
    volumes:
      # Named volume, so appointments survive `docker compose down` (but not `down -v`).
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      # scheduling_api waits on THIS, not on a fixed sleep: Postgres briefly accepts and then
      # drops connections during init, so a naive wait races the first query on a cold start.
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduling_api:
    build: ./scheduling_api
    ports:
      - "8000:8000"
    environment:
      CLINIC_DASHBOARD_DIR: /app/dashboard
      # Required. Supabase session-pooler URL, or the local-db profile's URL.
      CLINIC_DATABASE_URL: ${CLINIC_DATABASE_URL:?set CLINIC_DATABASE_URL (Supabase session pooler)}
      CLINIC_API_TOKEN: ${CLINIC_API_TOKEN:-}
    volumes:
      - ./dashboard:/app/dashboard:ro # serve the static dashboard at /dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: ./agent
    env_file:
      - ./agent/.env                 # DEEPGRAM/ANTHROPIC/CARTESIA/LIVEKIT keys (git-ignored)
    environment:
      MODE: telephony
      SCHEDULING_API_BASE_URL: http://scheduling_api:8000
      CLINIC_LOG_DIR: /logs
    volumes:
      - ./logs:/logs                 # write calls.jsonl for the API to read
    depends_on:
      scheduling_api:
        condition: service_healthy

volumes:
  clinic_pgdata:
